<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração do operador</title><link rel="stylesheet" href="/modelo-navegacao.css"><main><h1>Configuração do operador</h1><div class="panel"><p>Defina sua senha nesta interface. O cadastro inicial fica disponível apenas neste computador, para o email autorizado e enquanto não houver uma conta no projeto.</p><form id="setupForm"><label>Email autorizado<input id="setupEmail" type="email" readonly></label><label>Senha<input id="setupPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirmar senha<input id="setupConfirm" type="password" autocomplete="new-password" required></label><button id="setupSubmit" class="primary" disabled>Criar acesso</button></form><p id="setupStatus" role="status">Verificando configuração…</p><a href="/?next=clients">Entrar no cadastro de clientes</a></div></main><script src="/operator-setup-ui.js"></script></html>
